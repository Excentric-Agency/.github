name: Task
description: Use this form for other work, in code or not, for example admin, content, setup and follow-ups.
type: Task
body:
  - type: textarea
    id: what
    attributes:
      label: What needs to be done
      description: Describe the result. Add what the work needs, for example links, files and the people to ask.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: The client has the report, or the setting is live on production.
  - type: input
    id: due
    attributes:
      label: Due date
      placeholder: 2026-11-15, or none
