name: Task
description: Other work, in code or not: admin, content, setup, follow-ups.
type: Task
body:
  - type: textarea
    id: what
    attributes:
      label: What needs to be done
      description: The result, and what is necessary to do the work: links, files, people to ask.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: The client has the report, or the setting is live on production.
  - type: input
    id: due
    attributes:
      label: Due date
      placeholder: 2026-11-15, or none
